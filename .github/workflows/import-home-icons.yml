name: Import Pokémon HOME stat icon assets
on:
  push:
    paths:
      - '.github/workflows/import-home-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and validate original PNG assets
        run: |
          python3 - <<'PY'
          import hashlib, os, struct, urllib.request, urllib.parse
          names = {
            'hp':'HP_icon_HOME.png',
            'attack':'Attack_icon_HOME.png',
            'defense':'Defense_icon_HOME.png',
            'specialAttack':'Special_Attack_icon_HOME.png',
            'specialDefense':'Special_Defense_icon_HOME.png',
            'speed':'Speed_icon_HOME.png'
          }
          os.makedirs('public/assets/stats',exist_ok=True)
          for key,name in names.items():
              hash=hashlib.md5(name.encode()).hexdigest()
              url=f'https://archives.bulbagarden.net/media/upload/{hash[0]}/{hash[:2]}/{name}'
              sources=[
                  'https://images.weserv.nl/?url='+urllib.parse.quote(url,safe=''),
                  'https://wsrv.nl/?url='+urllib.parse.quote(url,safe=''),
                  url,
              ]
              errors=[]
              for source in sources:
                  try:
                      req=urllib.request.Request(source,headers={'User-Agent':'Mozilla/5.0','Referer':'https://archives.bulbagarden.net/'})
                      with urllib.request.urlopen(req,timeout=25) as resp: content=resp.read()
                      if content.startswith(bytes.fromhex('89504e470d0a1a0a')):break
                      errors.append('non PNG '+source)
                  except Exception as exc:
                      errors.append(str(exc)+' '+source)
              else:
                  raise RuntimeError('Image sources unavailable for '+name+': '+str(errors))
              if not content.startswith(bytes.fromhex('89504e470d0a1a0a')) or len(content)<100:
                  raise RuntimeError('Invalid PNG data: '+name)
              width,height=struct.unpack('>II',content[16:24])
              if not(32<=width<=2048 and 32<=height<=2048):
                  raise RuntimeError('Invalid PNG dimensions: '+name)
              with open('public/assets/stats/'+key+'.png','wb') as out: out.write(content)
              print(key,len(content),width,height,url)
          PY
      - name: Commit six verified original icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/stats
          if ! git diff --cached --quiet; then
            git commit -m "assets: vendor verified Pokémon HOME stat icons"
            git push
          fi
