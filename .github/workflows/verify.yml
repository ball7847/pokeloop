name: Verify PokeLoop
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test:virtual
      - run: node scripts/virtual-reach-summary.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: virtual-play-report
          path: artifacts/virtual-play/report.json
